services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fruta100
      POSTGRES_USER: fruta
      POSTGRES_PASSWORD: fruta_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fruta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruta -d fruta100"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  fruta_pgdata:
